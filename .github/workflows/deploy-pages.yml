name: Publicar El Consaburense (como Portfolio)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: elconsaburense-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Pillow y FFmpeg (usar binarios del runner)
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Preparar fotografías de monumentos de Consuegra
        run: python scripts/build_town_gallery.py
      - name: Crear vídeo limpio de 15 segundos
        run: python scripts/build_video.py
      - name: Generar promocional solo con escenas de preparación
        run: python scripts/recover_zamburinas_video.py
      - name: Validar sitio y vídeo
        run: |
          test -s public/index.html
          test -s public/sitemap.xml
          grep -q 'Sitemap: https://elconsaburense.moasin.dev/sitemap.xml' public/robots.txt
          for page in carta-para-llevar arroces-asados-por-encargo celebraciones; do
            test -s "public/$page/index.html"
            grep -q "rel=\"canonical\" href=\"https://elconsaburense.moasin.dev/$page/\"" "public/$page/index.html"
            grep -q 'application/ld+json' "public/$page/index.html"
            grep -q "<h1" "public/$page/index.html"
            grep -q "href=\"+34925097173\"" "public/$page/index.html" || grep -q "tel:+34925097173" "public/$page/index.html"
          done
          grep -q '"@type": "Restaurant"' public/index.html
          grep -q 'property="og:image"' public/index.html
          test -s public/404.html
          grep -q 'name="robots" content="noindex,follow"' public/404.html
          for file in calderico castillo-consuegra altovela ojos-guadiana alcardet finca-antigua; do test -s "public/media/vinos/$file.webp"; done
          ! grep -q 'src="https://images.pexels.com' public/index.html
          test -s public/styles.css
          test -s public/media/logo-consaburense.webp
          test -s public/media/sol-avatar.webp
          for file in croquetas croquetas-gamba-roja ensaladilla calamares verduritas-langostinos callos fabada albondigas suquet chuletitas-lechal entrecot solomillo solomillo-ajillo cachopin arroz-banda arroz-negro arroz-meloso cordero-asado cochinillo pescado-sal fingers-pollo queso brownie tatin-manzana; do test -s "public/media/carta-fotorealista/$file.webp"; done
          for file in croquetas croquetas-gamba-roja ensaladilla calamares verduritas-langostinos callos fabada albondigas suquet chuletitas-lechal entrecot solomillo solomillo-ajillo cachopin arroz-banda arroz-negro arroz-meloso cordero-asado cochinillo pescado-sal fingers-pollo queso brownie tatin-manzana; do grep -q "media/carta-fotorealista/$file.webp" public/index.html; done
          ! grep -q "Special:FilePath" public/index.html
          grep -q 'id="sol-launcher"' public/index.html
          grep -q 'id="sol-panel"' public/index.html
          grep -q 'id="para-llevar"' public/index.html
          grep -q 'id="encargo-dialog"' public/index.html
          grep -q 'id="encargo-open"' public/index.html
          grep -q 'id="encargo-title"' public/index.html
          grep -q "encargoOpen?.addEventListener" public/app.js
          ! grep -q 'window.setTimeout(()=>openEncargo()' public/app.js
          for file in arroz-meloso cordero-asado pescado-sal; do test -s "public/media/carta-fotorealista/$file.webp"; done
          test -s public/media/consaburense-15s.mp4
          test -s public/media/zamburinas-huevo-patatas-consaburense.mp4
          test -s public/media/zamburinas-preparacion-sin-fotos-v2.mp4
          test -s public/media/zamburinas-preparacion-cartel-v2.webp
          test -s public/videos/zamburinas/index.html
          grep -q 'id="vinos"' public/index.html
          grep -q 'id="opiniones"' public/index.html
          grep -q 'id="agenda"' public/index.html
          grep -q 'agenda-ciudadana-pagina' public/index.html
          node --check public/app.js
          node --check public/motion.js
          test -s public/motion.css
          grep -q 'motion.js?v=20261111-2' public/index.html
          grep -q 'wa.me/message/ACIXEAMQWNWME1' public/index.html
          grep -q 'id="reservas"' public/index.html
          grep -q 'id="eventos"' public/index.html
          grep -q 'Cumpleaños' public/index.html
          grep -q 'Bautizos y comuniones' public/index.html
          ! grep -q 'id="booking-form"' public/index.html
          ! grep -q 'booking-summary' public/index.html
          ! grep -q 'estamos preparando las notificaciones de reservas por WhatsApp' public/index.html
          for file in molinos castillo iglesia-san-juan plaza-espana; do test -s "public/media/consuegra/$file.webp"; done
          grep -q 'media/consuegra/plaza-espana.webp' public/index.html
          grep -q 'media/consuegra/molinos.webp' public/index.html
          grep -q 'id="town-lightbox"' public/index.html
          grep -q 'Iglesia de San Juan Bautista' public/index.html
          grep -q 'plaza-de-espana' public/index.html
          ! grep -q 'Calles de Consuegra' public/index.html
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 public/media/consaburense-15s.mp4
      - name: Validar SEO técnico, enlaces internos y datos estructurados
        run: python scripts/check_seo.py
      - name: Identificar versión compilada y verificar interacción
        run: |
          python scripts/check_ui.py
          python -c 'import json,os,pathlib;pathlib.Path("public/deploy-version.json").write_text(json.dumps({"source_commit":os.environ["GITHUB_SHA"],"source_branch":"main","published_via":"github-actions-gh-pages"},separators=(",",":"))+"\\n",encoding="utf-8")'
          test -s public/deploy-version.json
          grep -q "$GITHUB_SHA" public/deploy-version.json
      - name: Publicar usando GitHub Pages como Portfolio
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
