name: Publicar El Consaburense (como Portfolio)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: elconsaburense-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow y FFmpeg
        run: |
          python -m pip install --disable-pip-version-check Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Crear vídeo promocional de 15 segundos
        run: python scripts/build_video.py
      - name: Preparar y optimizar las fotos de platos
        run: python scripts/build_gallery.py
      - name: Validar sitio y vídeo
        run: |
          test -s public/index.html
          test -s public/styles.css
          test -s public/media/logo-consaburense.webp
          test -s public/media/consaburense-15s.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 public/media/consaburense-15s.mp4
      - name: Publicar usando GitHub Pages como Portfolio
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
